# Upload-only: Modrinth + CurseForge from an existing GitHub Release.
# Build locally first:  .\publish_local.ps1
# Then upload:           gh workflow run publish.yml -f version=2.1.1

name: Publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version (without v) matching GitHub Release assets
        required: true
      dry_run:
        description: Skip uploads if true
        required: false
        default: "false"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Resolve version
        id: ver
        shell: bash
        run: echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"

      - name: Download release jars
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.ver.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          gh release download "v${VERSION}" --repo "${{ github.repository }}" --dir dist --pattern 'jauml-*.jar'
          ls -la dist/
          count=$(find dist -name 'jauml-*.jar' | wc -l)
          if [ "$count" -eq 0 ]; then
            echo "No jauml-*.jar on release v${VERSION}. Run publish_local.ps1 first." >&2
            exit 1
          fi

      - name: Find release jars
        id: jars
        shell: bash
        run: |
          mapfile -t JARS < <(find dist -type f -name 'jauml-*.jar' | sort)
          printf '%s\n' "${JARS[@]}"
          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          echo "list<<$EOF" >> "$GITHUB_OUTPUT"
          printf '%s\n' "${JARS[@]}" >> "$GITHUB_OUTPUT"
          echo "$EOF" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Upload Modrinth + CurseForge
        if: ${{ inputs.dry_run != 'true' }}
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
          MODRINTH_ID: ${{ vars.MODRINTH_ID }}
          CURSEFORGE_ID: ${{ vars.CURSEFORGE_ID }}
          VERSION: ${{ steps.ver.outputs.version }}
          JAR_LIST: ${{ steps.jars.outputs.list }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${MODRINTH_ID:-}" && test -n "${CURSEFORGE_ID:-}"
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const version = process.env.VERSION;
          const jars = process.env.JAR_LIST.split(/\n/).map(s => s.trim()).filter(Boolean);

          function parseJar(jar) {
            const n = path.basename(jar);
            let loader = 'fabric';
            if (/neoforge/i.test(n)) loader = 'neoforge';
            else if (/forge/i.test(n)) loader = 'forge';
            else if (/fabric/i.test(n)) loader = 'fabric';
            const m = n.match(/^jauml-(?:fabric|forge|neoforge)-(.+)-(\d+\.\d+\.\d+(?:-[A-Za-z0-9.]+)?)\.jar$/i);
            const game = m ? m[1] : null;
            return { jar, name: n, loader, game };
          }

          const parsed = jars.map(parseJar);
          for (const p of parsed) {
            if (!p.game) throw new Error('Cannot parse MC version from ' + p.name);
          }

          (async () => {
            for (const p of parsed) {
              const body = {
                name: `Jauml ${version}`,
                version_number: version,
                changelog: `## Jauml ${version}\n\n### Bug Fixes\n* Fixed Fabric/NeoForge 26.1.2 crash from stub MixinMinecraft missing @Mixin (#3/#4).\n\n### File\n* ${p.name}`,
                dependencies: [],
                game_versions: [p.game],
                version_type: 'release',
                loaders: [p.loader],
                featured: false,
                status: 'listed',
                project_id: process.env.MODRINTH_ID,
                file_parts: ['file_0'],
                primary_file: 'file_0',
              };
              const form = new FormData();
              form.append('data', JSON.stringify(body));
              form.append('file_0', new Blob([fs.readFileSync(p.jar)]), p.name);
              const mrRes = await fetch('https://api.modrinth.com/v2/version', {
                method: 'POST',
                headers: { Authorization: process.env.MODRINTH_TOKEN },
                body: form,
              });
              const mrText = await mrRes.text();
              if (!mrRes.ok) throw new Error('Modrinth ' + mrRes.status + ' ' + p.name + ' ' + mrText.slice(0, 500));
              console.log('Modrinth OK', p.name);
            }

            const gvRes = await fetch('https://api.curseforge.com/v1/games/432/versions', {
              headers: { 'x-api-key': process.env.CURSEFORGE_API_KEY },
            });
            const gvJson = await gvRes.json();
            const flat = [];
            for (const g of gvJson.data || []) for (const v of g.versions || []) flat.push(v);
            const LOADER_IDS = { forge: 1, fabric: 4, neoforge: 6 };

            for (const p of parsed) {
              const hit = flat.find((v) => v.name === p.game);
              if (!hit) throw new Error('No CF game version for ' + p.game + ' (' + p.name + ')');
              const gameVersions = [hit.id];
              const loaderId = LOADER_IDS[p.loader];
              if (loaderId) gameVersions.push(loaderId);
              const meta = {
                changelog: `## Jauml ${version}\n\n### Bug Fixes\n* Fixed Fabric/NeoForge 26.1.2 MixinMinecraft @Mixin crash (#3/#4).`,
                changelogType: 'markdown',
                displayName: p.name,
                gameVersions,
                releaseType: 1,
              };
              const cfForm = new FormData();
              cfForm.append('metadata', JSON.stringify(meta));
              cfForm.append('file', new Blob([fs.readFileSync(p.jar)]), p.name);
              const cfRes = await fetch(
                `https://minecraft.curseforge.com/api/projects/${process.env.CURSEFORGE_ID}/upload-file`,
                { method: 'POST', headers: { 'X-Api-Token': process.env.CURSEFORGE_TOKEN }, body: cfForm },
              );
              const cfText = await cfRes.text();
              if (!cfRes.ok) throw new Error('CurseForge ' + cfRes.status + ' ' + p.name + ' ' + cfText.slice(0, 500));
              console.log('CurseForge OK', p.name);
            }
          })().catch((e) => { console.error(e); process.exit(1); });
          NODE
